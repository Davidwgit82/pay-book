{% extends 'master.html' %}

{% block title %}Paiement Réussi - BookStore{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-lg mt-12 p-8 text-center border border-gray-100">
    <!-- Icône de succès -->
    <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
        <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-2">Paiement Réussi !</h1>
    <p class="text-gray-600 mb-6">
        Merci pour ton achat. Ton paiement a été validé avec succès et ton exemplaire de livre t'est attribué.
    </p>

    <div class="space-y-3">
        <a href="{% url 'book-list' %}" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
            Retourner au catalogue
        </a>
        <a href="{% url 'index' %}" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-lg transition">
            Accueil
        </a>
    </div>
</div>
{% endblock %}
