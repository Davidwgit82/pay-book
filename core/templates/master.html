<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Mon Projet Livre{% endblock %}</title>

    <!-- Google Fonts : Cabin -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Cabin", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between"
  >
    <!-- Header / Barre de navigation -->
    <header class="bg-white shadow-sm">
      <nav
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <a href="{% url 'index' %}" class="text-xl font-bold text-indigo-600"
          >BookStore</a
        >
        <div class="space-x-4">
          <a href="{% url 'index' %}" class="hover:text-indigo-600 transition"
            >Accueil</a
          >
          <a
            href="{% url 'book-list' %}"
            class="hover:text-indigo-600 transition"
            >Livres</a
          >
        </div>
      </nav>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
      {% block content %} {% endblock %}
    </main>

    <!-- Footer -->
    <footer
      class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500"
    >
      <p>
        &copy; 2026 - Mon Projet Web de Vente de Livres. Tous droits réservés.
      </p>
    </footer>
  </body>
</html>
